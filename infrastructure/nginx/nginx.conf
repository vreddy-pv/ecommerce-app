user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'cache=$upstream_cache_status';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # ── HTTP Cache zone definition ──────────────────────────────────────────
    # This is Layer 1 caching: full HTTP response cache at the edge.
    # Non-personalised catalog responses are cached here.
    proxy_cache_path /var/cache/nginx
        levels=1:2
        keys_zone=catalog_cache:10m
        max_size=100m
        inactive=1h
        use_temp_path=off;

    # ── Upstream: API Gateway ───────────────────────────────────────────────
    upstream api_gateway {
        server api-gateway:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ── Health check for Docker ─────────────────────────────────────────
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ── Static routing: serve from CDN / static storage ─────────────────
        # In production: replace proxy_pass with CDN URL or object storage.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            proxy_pass http://api_gateway;
            expires 1d;
            add_header Cache-Control "public, immutable";
            add_header X-Cache-Type "STATIC";
        }

        # ── Dynamic routing (HTTP Cache Layer 1): catalog product listings ───
        location /api/catalog/products {
            proxy_cache catalog_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_valid 404 1m;
            proxy_cache_key "$uri$is_args$args";
            proxy_cache_use_stale error timeout updating;

            # Don't cache authenticated user requests
            proxy_cache_bypass $http_authorization;
            proxy_no_cache $http_authorization;

            add_header X-Cache-Status $upstream_cache_status;
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/catalog/categories {
            proxy_cache catalog_cache;
            proxy_cache_valid 200 24h;
            proxy_cache_key "$uri";
            add_header X-Cache-Status $upstream_cache_status;
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── All other API routes: pass through without caching ───────────────
        location /api/ {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Strip internal API key header from external requests
            proxy_set_header X-Internal-API-Key "";
        }

        # ── Frontend SPA ─────────────────────────────────────────────────────
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
