# Redis configuration for E-Commerce platform
# Three logical databases:
#   DB 0 — Session Cache (owned by aggregator-service)
#   DB 1 — Object Cache  (owned by catalog-service and inventory-service)
#   DB 2 — Rate Limiting (owned by api-gateway)

# Allow connections from all addresses inside Docker network
bind 0.0.0.0

# Max memory and eviction policy
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence: save snapshots to disk every 60s if 1000 keys changed
save 60 1000

# Append-only file for durability
appendonly yes
appendfilename "appendonly.aof"

# Logging
loglevel notice
