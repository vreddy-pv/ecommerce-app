server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Load-balanced routes resolve service names via Eureka (lb:// prefix)
      routes:
        - id: user-auth
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**,/api/users/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"

        - id: catalog
          uri: lb://catalog-service
          predicates:
            - Path=/api/catalog/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                key-resolver: "#{@userKeyResolver}"

        - id: inventory
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**

        - id: orders
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**

        - id: aggregator
          uri: lb://aggregator-service
          predicates:
            - Path=/api/aggregate/**

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

jwt:
  public-key: ${JWT_PUBLIC_KEY:test-placeholder}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
      # Composite health: gateway aggregates all downstream service health
      group:
        readiness:
          include: discoveryComposite,redis

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.ecommerce.gateway: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  cloud:
    gateway:
      routes: []
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  public-key: test-placeholder

eureka:
  client:
    enabled: false
